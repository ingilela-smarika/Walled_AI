[project]
name = "mcpguard"
version = "0.1.0"
description = "Per-request user approval for MCP traffic from Claude Desktop and Claude Web"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcpguard"]
